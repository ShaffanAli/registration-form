<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <form action="">
    <h1 class="heading">Registration Form</h1>
    <hr>
    <p>Username: <input type="text" class="username" id="username" required></p>
    <p>Password: <input type="password" class="password" id="password" required></p>
    <p>Confirm Password: <input type="password" class="confirm-password" id="confirm-password" required></p>
    <p>
        Country:
        <select name="country" id="country" required>
            <option value="">-Select Country-</option>
            <option value="pakistan">Pakistan</option>
            <option value="india">India</option>
            <option value="china">China</option>
            <option value="iran">Iran</option>
        </select><br>
        <input type="checkbox" id="checkbox" name="terms" required> I agree to the terms and conditions
        <hr>
        <p><input type="submit" class="register" ></p>
    </p>
    </form>
</body>
</html>
